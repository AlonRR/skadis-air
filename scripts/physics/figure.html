<!-- A stress figure: the scene named by ?id=, written by figures.py, drawn with three.js and photographed by figures.mjs. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stress figure</title>
    <style>
      body { margin: 0; background: #fff; font: 15px/1.4 'Segoe UI', Arial, sans-serif; color: #212529; }
      #fig { position: relative; width: 1200px; height: 900px; background: #fff; }
      #head { position: absolute; left: 28px; top: 16px; right: 28px; }
      #head h1 { font-size: 21px; margin: 0 0 6px; }
      #head p { margin: 0; color: #495057; font-size: 14px; }
      canvas { position: absolute; left: 0; top: 112px; }
      #labels { position: absolute; left: 0; top: 112px; width: 1200px; height: 600px; pointer-events: none; }
      #labels text { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #212529; paint-order: stroke; stroke: #fff;
        stroke-width: 4px; }
      #inset { position: absolute; left: 772px; top: 112px; width: 404px; height: 598px; border: 1px solid #adb5bd;
        border-radius: 4px; pointer-events: none; }
      #inset span { position: absolute; left: 8px; top: 4px; color: #495057; font-size: 13px; background: #fff;
        padding: 0 4px; }
      #foot { position: absolute; left: 28px; right: 28px; top: 724px; }
      #bar { position: relative; height: 18px; width: 520px; border-radius: 2px; }
      #ticks { position: relative; height: 20px; width: 520px; font-size: 13px; color: #495057; }
      #ticks span { position: absolute; transform: translateX(-50%); }
      #scale { display: flex; gap: 28px; align-items: flex-start; }
      #scale .key { font-size: 13px; color: #495057; }
      #scale .grey::before { content: ''; display: inline-block; width: 14px; height: 14px; margin-right: 7px;
        vertical-align: -2px; border-radius: 3px; background: rgb(196, 200, 204); }
      #holds { margin-top: 10px; font-size: 15px; }
      #holds div:first-child { font-weight: 600; }
      #note { margin-top: 6px; font-size: 13px; color: #495057; }
    </style>
    <script type="importmap">{ "imports": { "three": "/three/build/three.module.js" } }</script>
  </head>
  <body>
    <div id="fig">
      <div id="head"><h1 id="title"></h1><p id="caption"></p></div>
      <svg id="labels"></svg>
      <div id="inset"><span>the weak spot, close up</span></div>
      <div id="foot">
        <div id="scale">
          <div>
            <div class="key">von Mises stress, MPa per 10 N</div>
            <div id="bar"></div>
            <div id="ticks"></div>
          </div>
          <div class="key grey" id="grey"></div>
        </div>
        <div id="holds"></div>
        <div id="note"></div>
      </div>
    </div>
    <script type="module">
      import * as THREE from 'three';
      const id = new URLSearchParams(location.search).get('id');
      const s = await (await fetch(`/scenes/${id}.json`)).json();
      const blob = await (await fetch(`/scenes/${id}.bin`)).arrayBuffer();
      document.getElementById('title').textContent = s.title;
      document.getElementById('caption').innerHTML = s.caption.join('<br>');
      document.getElementById('grey').textContent = s.grey;
      document.getElementById('note').textContent = s.note;
      for (const line of s.holds.filter(Boolean)) {
        const div = document.createElement('div');
        div.textContent = line;
        document.getElementById('holds').append(div);
      }
      // the scale: its colours, its ticks, and its top, past which the colour stays
      const bar = document.getElementById('bar');
      bar.style.background = `linear-gradient(to right, ${s.scale.stops.join(', ')})`;
      const ticks = document.getElementById('ticks');
      for (const [at, text] of s.scale.ticks) {
        const t = document.createElement('span');
        t.style.left = `${at * 520}px`;
        t.textContent = text;
        ticks.append(t);
      }
      const end = document.createElement('span');
      end.style.left = '520px';
      end.style.transform = 'none';
      end.style.marginLeft = '10px';
      end.style.top = '-20px';
      end.style.whiteSpace = 'nowrap';
      end.textContent = `${s.scale.end}`;
      ticks.append(end);

      const nv = s.vertices;
      const nt = s.triangles;
      const positions = new Float32Array(blob, 0, nv * 3);
      const index = new Uint32Array(blob, nv * 12, nt * 3);
      const nc = s.creases;
      const lines = new Uint32Array(blob, nv * 12 + nt * 12, nc * 2);
      const colours = new Uint8Array(blob, nv * 12 + nt * 12 + nc * 8, nv * 3);
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      g.setAttribute('color', new THREE.BufferAttribute(colours, 3, true));
      g.setIndex(new THREE.BufferAttribute(index, 1));
      // unlit, so a colour on the part is the scale's colour; the creases drawn for its shape
      const scene = new THREE.Scene();
      const part = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
        vertexColors: true, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
      }));
      scene.add(part);
      const crease = new THREE.BufferGeometry();
      crease.setAttribute('position', g.getAttribute('position'));
      crease.setIndex(new THREE.BufferAttribute(lines, 1));
      scene.add(new THREE.LineSegments(crease, new THREE.LineBasicMaterial({ color: 0x212529, transparent: true, opacity: 0.5 })));
      const [W, H] = [1200, 600];
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.outputColorSpace = THREE.LinearSRGBColorSpace; // the colours as given, not converted
      renderer.setPixelRatio(1);
      renderer.setSize(W, H);
      renderer.setClearColor(0xffffff, 1);
      renderer.setScissorTest(true);
      document.getElementById('fig').prepend(renderer.domElement);
      const boxes = [[0, 0, 768, 600], [772, 0, 404, 598]];
      const cams = s.views.map((v, i) => {
        const [, , w, h] = boxes[i];
        const c = new THREE.PerspectiveCamera(v.fov, w / h, 0.5, 5000);
        c.up.set(...v.up);
        c.position.set(...v.position);
        c.lookAt(...v.target);
        c.updateMatrixWorld();
        return c;
      });
      cams.forEach((c, i) => {
        const [x, y, w, h] = boxes[i];
        renderer.setViewport(x, H - y - h, w, h);
        renderer.setScissor(x, H - y - h, w, h);
        renderer.render(scene, c);
      });
      // each marker in each view where it falls inside the view: a ring on the spot, and its value beside it
      const svg = document.getElementById('labels');
      const ns = 'http://www.w3.org/2000/svg';
      const add = (tag, attrs) => {
        const e = document.createElementNS(ns, tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        svg.append(e);
        return e;
      };
      cams.forEach((c, i) => {
        const [x0, y0, w, h] = boxes[i];
        const placed = []; // the labels' boxes in this view, so the next is moved off them
        s.markers.forEach((m, j) => {
          const v = new THREE.Vector3(...m.at).project(c);
          if (Math.abs(v.x) > 1 || Math.abs(v.y) > 1 || v.z > 1) return;
          const [x, y] = [x0 + ((v.x + 1) / 2) * w, y0 + ((1 - v.y) / 2) * h];
          const peak = m.kind === 'peak';
          // hidden from this view if the part is in front of it: then the label says so
          const spot = new THREE.Vector3(...m.at);
          const ray = new THREE.Raycaster(c.position, spot.clone().sub(c.position).normalize());
          const hit = ray.intersectObject(part)[0];
          const hidden = hit !== undefined && hit.distance < c.position.distanceTo(spot) - 0.3;
          if (hidden) window.hidden = [...(window.hidden ?? []), `${m.kind} in view ${i}`];
          const left = x > x0 + w * 0.5;
          const lift = { peak: -38, layers: -70, contact: 38 }[m.kind] ?? 38;
          const [tx, ty] = [x + (left ? -46 : 46), y + lift];
          const line = add('line', { x1: x, y1: y, x2: tx, y2: ty, stroke: '#212529', 'stroke-width': 1.5 });
          add('circle', { cx: x, cy: y, r: peak ? 9 : 7, fill: 'none', stroke: '#fff', 'stroke-width': 5 });
          const ring = { peak: '#d6336c', layers: '#e8590c', contact: '#212529' }[m.kind] ?? '#212529';
          add('circle', { cx: x, cy: y, r: peak ? 9 : 7, fill: 'none', stroke: ring,
            'stroke-width': 2.5, 'stroke-dasharray': m.kind === 'contact' ? '4 3' : '' });
          const text = add('text', { x: tx + (left ? -6 : 6), y: ty + 5, 'text-anchor': left ? 'end' : 'start' });
          const inside = m.text.includes('(inside');
          text.textContent = !hidden || inside ? m.text : i === 0 ? `${m.text} (out of sight here: the close-up)` : `${m.text} (out of sight)`;
          // the label on the side it fits, or pulled inside its view where neither side fits
          const width = text.getBBox().width;
          const room = (toLeft) => (toLeft ? x - 52 - width - (x0 + 4) : x0 + w - 4 - (x + 52 + width));
          let toLeft = left;
          if (room(toLeft) < 0 && room(!toLeft) > room(toLeft)) toLeft = !toLeft;
          let start = toLeft ? x - 52 - width : x + 52;
          start = Math.max(x0 + 4, Math.min(start, x0 + w - 4 - width));
          text.setAttribute('x', start);
          text.setAttribute('text-anchor', 'start');
          // off the labels already placed: stepped away from the spot until clear
          let top = ty;
          const clash = (t) => placed.some((b) => start < b.x + b.w + 8 && b.x < start + width + 8 && Math.abs(t - b.y) < 20);
          for (let k = 1; clash(top) && k < 12; k++) top = ty + (lift < 0 ? -1 : 1) * 22 * k;
          placed.push({ x: start, w: width, y: top });
          text.setAttribute('y', top + 5);
          line.setAttribute('y2', top);
          line.setAttribute('x2', toLeft ? Math.min(start + width + 4, x - 6) : Math.max(start - 4, x + 6));
        });
      });
      window.done = true;
    </script>
  </body>
</html>
