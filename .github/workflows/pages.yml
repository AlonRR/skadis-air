# .github/workflows/pages.yml
#
# Publishes the page on GitHub Pages (D103, 15 Oct 2026), at https://alonrr.github.io/skadis-air/.
#
# It deploys the latest stable release, not main's newest commit (A291, C292): it runs when a
# `checks` run on main ends, and only if that run succeeded (C135), finds the highest tag vX.Y.Z on
# main with scripts/release/latest-release.sh, refuses it unless a checks run passed on its commit,
# and builds that commit. A manual run does the same. A tag's own push is not a trigger: the
# github-pages environment deploys only from main, and a run started by a tag runs on the tag. So a
# release reaches the page with the main push that goes with it: push the tag first, or in the same
# push as main, or the run finds the release before it.
#
# Skipped while the repository is private: Pages needs it public and switched on (Settings ->
# Pages -> Source: GitHub Actions), both the owner's, and a skipped run is not a red one (C135).
# Gitea has its Actions off for this repository (D105), so this runs on GitHub alone.
#
# tests/test-workflow.sh holds this file to actionlint and to the rules above, with controls.
name: pages

on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false   # never stop a deployment halfway

jobs:
  deploy:
    if: >-
      ${{ !github.event.repository.private &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read     # to see that the checks passed on the release's commit
      pages: write      # to deploy to Pages
      id-token: write   # to prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0   # every commit and tag, to find the latest release on main
      - id: release
        name: Find the latest stable release
        run: bash scripts/release/latest-release.sh | tee -a "$GITHUB_OUTPUT"
      - name: Refuse it unless the checks passed on its commit
        env:
          GH_TOKEN: ${{ github.token }}
          sha: ${{ steps.release.outputs.sha }}
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/checks.yml/runs?head_sha=${sha}&status=success"
          passed=$(gh api "$runs" --jq .total_count)
          echo "checks runs passed on $sha: $passed"
          [ "$passed" -gt 0 ]
      - name: Check out the release
        run: git checkout --detach "${{ steps.release.outputs.sha }}"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the locked dependencies
        run: npm ci
      - name: Build the page
        run: npm run build -w skadis-air-web
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/out/site
      - id: deployment
        uses: actions/deploy-pages@v5
