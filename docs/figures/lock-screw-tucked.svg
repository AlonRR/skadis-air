<circle cx="190" cy="250" r="20.0" class="headdeep"/>
<text x="30" y="434" class="s">Through the slot you see the screw head, 8 mm behind the face:</text>
<text x="30" y="452" class="s">nothing in the slot itself. Dashed: the standoff behind.</text>
<text x="420" y="78" class="t">From the side, through the slot</text>
<rect x="420" y="160" width="60" height="340" class="wall"/>
<rect x="480" y="180" width="150" height="240" class="padx"/>
<rect x="550.0" y="199.0" width="80.0" height="279.5" class="room"/>
<rect x="630" y="160" width="50" height="340" class="boardx"/>
<rect x="630" y="224.0" width="50" height="152.0" class="cutx"/>
<rect x="529.0" y="272.5" width="21.0" height="55.0" class="cutx"/>
<rect x="430" y="287.5" width="102.0" height="25.0" class="screwx"/>
<rect x="532.0" y="275.0" width="18.0" height="50.0" class="screwx"/>
<rect x="570" y="351.0" width="190" height="25.0" class="hook"/>
<rect x="570" y="351.0" width="25.0" height="107.5" class="hook"/>
<rect x="735.0" y="271.0" width="25.0" height="80" class="hook"/>
<line x1="800" y1="300" x2="550.0" y2="300" class="driver"/>
<text x="420.0" y="520.0" class="s">wall</text>
<text x="490.0" y="520.0" class="s">standoff 15 mm</text>
<text x="630.0" y="520.0" class="s">board 5</text>
<text x="690" y="170" class="s">red: a screwdriver through the slot</text>
<text x="690" y="190" class="s">orange: a hook, its back tab 6 mm deep</text>
<text x="690" y="210" class="s">dotted: the hook's room, 8 mm (C99)</text>
<text x="960" y="110" class="s">The lock screw goes in through the slot, head and all, and its</text>
<text x="960" y="130" class="s">head sits in a recess in the floor of the hook's room, 8 mm behind</text>
<text x="960" y="150" class="s">the board: nothing of it is in the slot or in the room, so a hook</text>
<text x="960" y="170" class="s">goes in as in any slot. A screwdriver reaches it through the slot.</text>
<text x="960" y="190" class="s"></text>
<text x="960" y="210" class="s">Its head must pass the slot: 5.2 mm wide as drawn, 5.16 mm as</text>
<text x="960" y="230" class="s">printed (T109). A 4 mm screw's head is 8 mm, so the lock screw</text>
<text x="960" y="250" class="s">needs its own, smaller size: a pan head no more than 5 mm across,</text>
<text x="960" y="270" class="s">such as a 2.5 mm screw (ISO 7045 M2.5: 5.0 mm), which leaves</text>
<text x="960" y="290" class="s">0.1 mm either side; check the head of the screw you buy. It only</text>
<text x="960" y="310" class="s">stops the board lifting off its keyholes, which carry the weight.</text>
<text x="960" y="330" class="s"></text>
<text x="960" y="350" class="s">Drawn for the lock screws of a board on keyholes; the keyhole</text>
<text x="960" y="370" class="s">screws, and boards with screw holes, stay as they are.</text></svg>
