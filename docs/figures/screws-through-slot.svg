<text x="830" y="78" class="t">What the head rests on, at the slot</text>
<rect x="880" y="110" width="200" height="60" class="board"/>
<rect x="947.6" y="110" width="64.8" height="60" class="chamfer"/>
<rect x="956.6" y="110" width="46.800000000000004" height="60" class="slot"/>
<circle cx="980" cy="140" r="36.0" class="head"/>
<text x="1090" y="135" class="s">an 8 mm pan head alone</text>
<text x="1090" y="153" class="n">rests on 0.4 mm either side</text>
<rect x="880" y="230" width="200" height="60" class="board"/>
<rect x="947.6" y="230" width="64.8" height="60" class="chamfer"/>
<rect x="956.6" y="230" width="46.800000000000004" height="60" class="slot"/>
<circle cx="980" cy="260" r="40.5" class="washer"/>
<text x="1090" y="255" class="s">a 9 mm washer (DIN 125)</text>
<text x="1090" y="273" class="n">rests on 0.9 mm either side</text>
<rect x="880" y="350" width="200" height="60" class="board"/>
<rect x="947.6" y="350" width="64.8" height="60" class="chamfer"/>
<rect x="956.6" y="350" width="46.800000000000004" height="60" class="slot"/>
<circle cx="980" cy="380" r="54.0" class="washer"/>
<text x="1090" y="375" class="s">a 12 mm washer (DIN 9021)</text>
<text x="1090" y="393" class="ok">rests on 2.4 mm either side</text>
<text x="830" y="520" class="s">Today (D73, D74): its own countersunk hole 10 mm in from both edges, the head flush, a round</text>
<text x="830" y="540" class="s">standoff behind it; the corner slot stays free for a hook, and the hole shows on the front.</text>
<text x="830" y="560" class="s"></text>
<text x="830" y="580" class="s">Through the slot: the screw goes through the corner tile's centre slot and a bore in the</text>
<text x="830" y="600" class="s">standoff behind it, as IKEA holds its spacer (D131). The front has no hole of its own and the</text>
<text x="830" y="620" class="s">standoff is the one D244 and D245 put there; that slot then holds the screw, not a hook.</text>
<text x="830" y="640" class="s">The slot is 5.2 mm wide, so the head needs something wider to rest on: the slot's 1 mm chamfer</text>
<text x="830" y="660" class="s">opens its mouth to 7.2 mm, and an 8 mm head rests on 0.4 mm either side. A 12 mm washer</text>
<text x="830" y="680" class="s">(DIN 9021) rests on 2.4 mm; a 9 mm one (DIN 125) on 0.9. With the bore slot-shaped, the screw</text>
<text x="830" y="700" class="s">may sit anywhere 5.6 mm above or below the slot's middle, so a hole drilled a little off still</text>
<text x="830" y="720" class="s">takes the board, and the washer covers the slot.</text></svg>
