<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Skådis Air's icon (D137): five slots of a SKÅDIS board's staggered grid (docs/skadis-standard.md),
       cut through a tile in the design system's action colour (tokens.css: action, light and dark).
       The slots are drawn wider than to scale, so they still show at 16 px. -->
  <style>
    .tile { fill: #0469b0; }
    @media (prefers-color-scheme: dark) { .tile { fill: #5aaef0; } }
  </style>
  <mask id="slots">
    <rect width="32" height="32" fill="#fff"/>
    <g fill="#000">
      <rect x="6.75" y="4" width="3.5" height="8" rx="1.75"/>
      <rect x="21.75" y="4" width="3.5" height="8" rx="1.75"/>
      <rect x="14.25" y="12" width="3.5" height="8" rx="1.75"/>
      <rect x="6.75" y="20" width="3.5" height="8" rx="1.75"/>
      <rect x="21.75" y="20" width="3.5" height="8" rx="1.75"/>
    </g>
  </mask>
  <rect class="tile" width="32" height="32" rx="6" mask="url(#slots)"/>
</svg>
